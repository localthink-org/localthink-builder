<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTF Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>LocalThink</h1>
          <p>Save this AI conversation as a local .ltf.md file.</p>
          <p><a href="https://localthink.org" target="_blank" rel="noopener noreferrer">Read more about LocalThink Format (LTF)</a></p>
        </div>
        <span id="statusPill" class="pill">Ready</span>
      </header>

      <section class="actions">
        <button id="captureButton" type="button">Capture</button>
        <button id="downloadButton" type="button" disabled>Download .ltf.md</button>
      </section>

      <p id="message" class="message"></p>

      <section class="form" aria-label="LTF metadata">
        <label>
          <span>Title</span>
          <input id="titleInput" type="text" placeholder="Conversation title" />
        </label>

        <div class="grid">
          <label>
            <span>Created</span>
            <input id="createdInput" type="text" />
          </label>
          <label>
            <span>Language</span>
            <input id="languageInput" type="text" value="en" />
          </label>
        </div>
      </section>

      <section class="summary">
        <div><strong id="turnCount">0</strong><span> turns</span></div>
        <div><strong id="platformName">No capture</strong><span> platform</span></div>
      </section>

      <section id="qualityPanel" class="quality">
        <div class="qualityHeader">
          <strong>Capture quality</strong>
          <span id="qualityStatus">No capture</span>
        </div>
        <ul id="qualityList"></ul>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
